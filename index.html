<style>
:root{
  --bg:#ffffff; --ink:#111111; --mute:#6b6b6b; --line:#e4e4e2; --soft:#f4f4f2; --btn:#111111; --btn-ink:#ffffff;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--ink:#f2f2f0;--mute:#9a9a96;--line:#2b2b29;--soft:#1c1c1b;--btn:#f2f2f0;--btn-ink:#121211}}
:root[data-theme="dark"]{--bg:#121211;--ink:#f2f2f0;--mute:#9a9a96;--line:#2b2b29;--soft:#1c1c1b;--btn:#f2f2f0;--btn-ink:#121211}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;height:64px}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.6px;text-decoration:none;color:inherit}
.mark img{width:18px;height:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark img{filter:invert(1)}}
.lang{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.hero{padding:56px 0 28px;text-align:center}
h1{font-size:clamp(40px,11vw,64px);line-height:.98;letter-spacing:-2.4px;margin:0 0 18px;font-weight:700}
.lede{font-size:17px;line-height:1.45;color:var(--mute);margin:0 auto 28px;max-width:30ch}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;height:56px;padding:0 30px;font-size:17px;font-weight:700;width:min(100%,340px)}
.cta:focus-visible,.ghost:focus-visible,.sw:focus-visible,.lang:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.priv{font-size:13px;color:var(--mute);margin:14px 0 0}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:44px 0 0;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--soft);border-radius:18px;padding:16px 12px;font-size:13px;line-height:1.35;text-align:left;counter-increment:s}
.how li::before{content:counter(s);display:block;font-weight:700;font-size:22px;margin-bottom:8px}
.busy{display:none;text-align:center;padding:80px 0;color:var(--mute)}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);margin:0 auto 16px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.res{display:none;padding:12px 0 40px;text-align:center}
.card{width:min(82%,340px);aspect-ratio:9/16;margin:0 auto;border-radius:22px;overflow:hidden;background:var(--soft);box-shadow:0 18px 50px rgba(0,0,0,.12)}
.card img{width:100%;height:100%;display:block}
.sws{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.sw{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px}
.sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.sw.on{border-color:var(--ink)}
.meta{font-size:14px;color:var(--mute);margin:10px 0 18px}
.acts{display:grid;gap:10px;justify-items:center}
.ghost{background:none;border:1px solid var(--line);border-radius:99px;height:50px;padding:0 24px;font-size:15px;font-weight:600;width:min(100%,340px)}
.ghost.plan{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;border-color:var(--ink)}
.more{background:var(--soft);border:0;border-radius:16px;padding:14px 16px;font-size:14px;width:min(100%,340px);margin-bottom:6px}
.err{display:none;text-align:center;padding:48px 0}
.err h2{font-size:26px;letter-spacing:-.8px;margin:0 0 10px}
.err p{color:var(--mute);line-height:1.45;max-width:32ch;margin:0 auto 22px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.sheet[hidden]{display:none}
.sheet-body{width:min(100%,360px)}
.sheet-body img{max-width:100%;max-height:66vh;width:auto;margin:0 auto;border-radius:18px;display:block;-webkit-touch-callout:default;user-select:auto}
.sheet-text{background:var(--bg);color:var(--ink);border-radius:16px;padding:18px;font-size:16px;line-height:1.45;margin:0;user-select:text;-webkit-user-select:text}
.sheet-note{color:#fff;font-size:15px;line-height:1.4;text-align:center;max-width:32ch;margin:16px 0 14px}
.sheet-x{background:#fff;color:#111;border:0;border-radius:99px;height:46px;padding:0 28px;font-weight:700;font-size:15px}
/* the planner, visible from the first screen: header link + a short "more than a score" block under the steps */
.hd-r{display:flex;align-items:center;gap:8px}
.nav-app{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;text-decoration:none}
.nav-app:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.also{margin:56px 0 0;text-align:left}
.also h2{font-size:26px;line-height:1.1;letter-spacing:-.8px;margin:0 0 6px}
.also>p{color:var(--mute);font-size:15px;line-height:1.45;margin:0 0 18px}
.feat{list-style:none;margin:0 0 22px;padding:0;border-top:1px solid var(--line)}
.feat li{display:grid;grid-template-columns:1fr;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.feat b{font-size:16px;letter-spacing:-.2px}
.feat span{font-size:14px;color:var(--mute);line-height:1.4}
.shots{display:block;width:calc(100% + 16px);max-width:none;height:auto;margin:4px -8px 18px}
.also .ghost.plan{width:100%;max-width:none;background:var(--ink);color:var(--bg);font-weight:700}
footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 0 40px;font-size:13px;color:var(--mute);line-height:1.6}
footer a{color:inherit}
</style>
</head>
<body>
<script src="launch.js?v=1"></script>
<div class="wrap">
  <header>
    <a class="mark" href="./" aria-label="pintertag"><img src="assets/logo.png" alt="">pintertag</a>
    <div class="hd-r"><a class="nav-app" href="app/" data-t="navApp"></a><button class="lang" id="lang" aria-label="Language">TR</button></div>
  </header>

  <main>
    <section class="hero" id="start">
      <h1 data-t="h1"></h1>
      <p class="lede" data-t="lede"></p>
      <button class="cta" id="pick" data-t="pick"></button>
      <p class="priv" data-t="priv"></p>
      <ol class="how"><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ol>
      <div class="also">
        <h2 data-t="alsoH"></h2>
        <p data-t="alsoP"></p>
        <img class="shots" src="assets/app-phones.webp" width="980" height="1120" alt="" loading="lazy" decoding="async" id="shots">
        <ul class="feat">
          <li><b data-t="f1"></b><span data-t="f1s"></span></li>
          <li><b data-t="f2"></b><span data-t="f2s"></span></li>
          <li><b data-t="f3"></b><span data-t="f3s"></span></li>
          <li><b data-t="f4"></b><span data-t="f4s"></span></li>
        </ul>
        <a class="ghost plan" href="app/" data-t="openApp"></a>
      </div>
    </section>

    <section class="busy" id="busy" aria-live="polite"><div class="spin"></div><span data-t="busy"></span></section>

    <section class="err" id="err">
      <h2 data-t="errH"></h2>
      <p data-t="errP"></p>
      <button class="cta" data-act="again" data-t="tryAgain"></button>
    </section>

    <section class="res" id="res">
      <div class="card"><img id="cardImg" alt=""></div>
      <div class="sws" role="group" id="sws">
        <button class="sw" data-theme="pink"><i style="background:#F5CCD6"></i><span data-t="pink"></span></button>
        <button class="sw" data-theme="cream"><i style="background:#EFE9DF"></i><span data-t="cream"></span></button>
        <button class="sw" data-theme="black"><i style="background:#121211"></i><span data-t="black"></span></button>
      </div>
      <p class="meta" id="meta"></p>
      <div class="acts">
        <button class="more" id="more" data-act="more" hidden data-t="more"></button>
        <button class="cta" data-act="share" data-t="share"></button>
        <button class="ghost" data-act="dare" data-t="dare"></button>
        <a class="ghost plan" href="app/?signup=1" data-t="plan"></a>
        <button class="ghost" data-act="again" data-t="another"></button>
      </div>
    </section>
  </main>

  <footer>
    <span data-t="foot"></span> <a href="app/" data-t="openApp"></a> · <a href="https://instagram.com/pintertag" rel="noopener">@pintertag</a><br><a href="privacy/">Privacy</a> · <a href="terms/">Terms</a> · <a href="support/">Support</a>
  </footer>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-body"></div><p class="sheet-note"></p><button class="sheet-x" data-t="close"></button></div>
<input id="file" type="file" accept="image/*" multiple hidden>

<script>
/* language first: gridcheck.js reads the global `lang` for card text */
var lang = (function(){ try { var s = localStorage.getItem('pt-lang'); if (s) return s; } catch(e){} return 'en'; })();
</script>
<script src="score.js?v=5"></script>
<script src="gridcheck.js?v=720"></script>
<script>
(function(){
  var SITE = 'https://pintertag.com';
  var TX = {
    en: { navApp:'Planner', alsoH:'The score is just the start.', alsoP:'Pintertag is a free planner for your Instagram feed. Everything runs on your phone.', f1:'Plan your next 9', f1s:'Drop in photos and see your grid before you post. One tap fixes the order.', f2:'Pick the best from a shoot', f2s:'Upload up to 40 photos. Get the one to post and a carousel from one look.', f3:'Post and story calendar', f3s:'Day, time and caption for every post and story, in one week view.', f4:'Fits my grid?', f4s:'See a photo at the top of your grid before you post. Get a fit score and what to fix.', h1:'What does your grid score?', lede:'Upload a screenshot of your Instagram profile. Your score and a story card are ready in seconds.',
      pick:'Choose a screenshot', priv:'Runs on your phone. Nothing is uploaded.', s1:'Open your profile on Instagram and take a screenshot.', s2:'Pick it here. We read the 9 newest posts.', s3:'Get your score and share the card to your story.',
      busy:'Reading your grid…', errH:'No grid found.', errP:'Take a screenshot of your Instagram profile with the grid filling most of the screen, then try again.', tryAgain:'Try another screenshot',
      pink:'Pink', cream:'Cream', black:'Black', share:'Share to story', dare:'Challenge a friend', another:'Score another grid',
      more:'Only {n} posts read. Scroll a little on Instagram and add one more screenshot to complete 9.', read:'{n} posts read.',
      dareText:'My grid scored {s}. What does yours score? ', foot:'pintertag — your feed’s art director.', plan:'Plan your next 9 posts · free account', openApp:'Open the planner', saved:'Card saved.', close:'Close', hold:'Press and hold the card, then tap “Save to Photos”. Post it to your story from there.', copied:'Copied. Paste it to a friend.', copyIt:'Copy this and send it to a friend.' },
    tr: { navApp:'Planlayıcı', alsoH:'Puan sadece başlangıç.', alsoP:'Pintertag, Instagram feed’in için ücretsiz bir planlayıcı. Her şey telefonunda çalışır.', f1:'Sonraki 9’u planla', f1s:'Fotoğrafları ekle, paylaşmadan önce grid’ini gör. Tek dokunuşla sırayı düzeltir.', f2:'Çekimden en iyisini seç', f2s:'40 fotoğrafa kadar yükle. Paylaşılacak kareyi ve tek look’tan bir karusel al.', f3:'Post ve story takvimi', f3s:'Her post ve story için gün, saat ve caption, tek hafta görünümünde.', f4:'Grid’ime uyar mı?', f4s:'Paylaşmadan önce kareyi grid’inin en başında gör. Uyum puanını ve neyi düzelteceğini öğren.', h1:'Grid’in kaç alır?', lede:'Instagram profilinin ekran görüntüsünü yükle. Puanın ve story kartın saniyeler içinde hazır.',
      pick:'Ekran görüntüsü seç', priv:'Telefonunda çalışır. Hiçbir şey yüklenmez.', s1:'Instagram’da profilini aç, ekran görüntüsü al.', s2:'Buradan seç. En yeni 9 postu okuruz.', s3:'Puanını al, kartı story’de paylaş.',
      busy:'Grid’in okunuyor…', errH:'Grid bulunamadı.', errP:'Instagram profilinin, grid ekranın çoğunu kaplayacak şekilde ekran görüntüsünü al ve tekrar dene.', tryAgain:'Başka ekran görüntüsü seç',
      pink:'Pembe', cream:'Krem', black:'Siyah', share:'Story’de paylaş', dare:'Arkadaşına meydan oku', another:'Başka grid puanla',
      more:'Sadece {n} post okundu. Instagram’da biraz aşağı kaydırıp bir ekran görüntüsü daha ekle, 9’a tamamlansın.', read:'{n} post okundu.',
      dareText:'Grid’im {s} aldı. Seninki kaç alır? ', foot:'pintertag — feed’in sanat yönetmeni.', plan:'Sonraki 9 postunu planla · ücretsiz hesap', openApp:'Planlayıcıyı aç', saved:'Kart kaydedildi.', close:'Kapat', hold:'Karta basılı tut, “Fotoğraflar’a Kaydet”e dokun. Sonra story’de paylaş.', copied:'Kopyalandı. Arkadaşına yapıştır.', copyIt:'Bunu kopyala, arkadaşına gönder.' }
  };
  var $ = function(id){ return document.getElementById(id); };
  var t = function(k){ return (TX[lang] || TX.en)[k]; };
  var theme = 'pink'; try { theme = localStorage.getItem('pt-card') || 'pink'; } catch(e){}
  var last = null, srcs = [], adding = false, blob = null, url = '';

  function paint(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.dataset.t); });
    var sh = $('shots'); if (sh) sh.alt = lang === 'tr' ? 'Pintertag uygulaması: grid planı ve karusel puanı' : 'The Pintertag app: grid plan and carousel score';
    $('lang').textContent = lang === 'tr' ? 'EN' : 'TR';
    document.title = lang === 'tr' ? 'Pintertag — Instagram grid puanı, feed planlayıcı ve karusel puanı' : 'Pintertag — Instagram grid score, feed planner and carousel score';
    document.querySelectorAll('.sw').forEach(function(b){ var on = b.dataset.theme === theme; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (last) meta();
  }
  function view(id){ ['start','busy','err','res'].forEach(function(s){ $(s).style.display = s === id ? 'block' : 'none'; }); window.scrollTo(0, 0); }
  function meta(){ var n = Math.min(9, last.tiles.length); $('meta').textContent = GC.verdict(last.score) + ' ' + t('read').replace('{n}', n);
    var m = $('more'); m.hidden = n >= 9; m.textContent = t('more').replace('{n}', n); }
  var readFile = function(f){ return new Promise(function(res){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ res(null); }; r.readAsDataURL(f); }); };

  async function run(files){
    view('busy');
    var fresh = (await Promise.all([].slice.call(files, 0, 4).map(readFile))).filter(Boolean);
    srcs = adding ? srcs.concat(fresh).slice(0, 4) : fresh; adding = false;
    var r = await GC.readShots(srcs);
    if (!r.tiles || r.tiles.length < 3){ view('err'); return; }
    var tiles = r.tiles.slice(0, 9), ms = [];
    for (var i = 0; i < tiles.length; i++){ var im = await GC.loadImg(tiles[i]); ms.push(im ? PTScore.measure(im) : null); }
    var sc = PTScore.scoreGrid(ms), score = sc ? sc.total : 0, vk = GC.vibeOf(ms), vt = GC.vibeText(vk);
    last = { tiles: r.tiles, ratio: r.ratio, score: score, vk: vk, vName: vt[0], vLine: vt[1], roast: GC.roastOf(ms, ms.map(function(){ return null; }), score) };
    await card(); view('res'); meta();
  }
  async function card(){ if (!last) return;
    blob = await GC.card({ score: last.score, vibe: last.vk, vibeName: last.vName, vibeLine: last.vLine, tiles: last.tiles, ratio: last.ratio, flags: [], roast: last.roast, date: '', theme: theme });
    if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob); $('cardImg').src = url;
    $('cardImg').alt = (lang === 'tr' ? 'Grid puanı ' : 'Grid score ') + last.score; }
  async function share(){ if (!blob) return; var file = new File([blob], 'pintertag-' + last.score + '.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file] }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    /* no share sheet (in-app browsers, http): show the card big so it can be long-pressed and saved */
    sheet('<img src="' + url + '" alt="">', t('hold')); }
  async function dare(){ var text = t('dareText').replace('{s}', last ? last.score : '') + SITE;
    try { if (navigator.share){ await navigator.share({ text: text }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    var ok = false; try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
    sheet('<p class="sheet-text">' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</p>', ok ? t('copied') : t('copyIt')); }
  function sheet(inner, note){ var s = $('sheet'); s.querySelector('.sheet-body').innerHTML = inner; s.querySelector('.sheet-note').textContent = note; s.hidden = false; }
  $('sheet').onclick = function(e){ if (e.target === this || e.target.closest('.sheet-x')) this.hidden = true; };

  $('pick').onclick = function(){ $('file').click(); };
  $('file').onchange = function(){ var f = this.files; if (f && f.length) run(f); this.value = ''; };
  $('lang').onclick = function(){ lang = lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('pt-lang', lang); } catch(e){} paint(); if (last) card(); };
  $('sws').onclick = function(e){ var b = e.target.closest('.sw'); if (!b) return; theme = b.dataset.theme; try { localStorage.setItem('pt-card', theme); } catch(e){} paint(); card(); };
  document.addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if (!b) return; var a = b.dataset.act;
    if (a === 'again'){ adding = false; $('file').click(); }
    if (a === 'more'){ adding = true; $('file').click(); }
    if (a === 'share') share();
    if (a === 'dare') dare(); });
  paint(); view('start');
})();
</script>
